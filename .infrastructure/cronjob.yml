apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-cronjob
  namespace: mateapp

spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: todo-cronjob
              image: ikulyk404/busyboxplus:curl
              command:
                - /bin/sh
                - -c
                - curl http://todoapp-service.mateapp.svc.cluster.local/api/health

              resources:
                requests:
                  cpu: "100m"
                  memory: "100Mi"
                limits:
                  cpu: "200m"
                  memory: "200Mi"

          restartPolicy: OnFailure
